name: Check

on:
  push:
  pull_request:

jobs:
  check:
    # Playwright 1.60 has no Chromium for ubuntu-latest (26.04) yet. Move up when it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/taxo.py check
      - name: Build the site and test it in a headless browser
        run: python3 -m pytest tests
